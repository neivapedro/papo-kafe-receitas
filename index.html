  <!-- tema escolhido nos Ajustes: aplicado antes da primeira pintura, sem piscar -->
  <script>
    try {
      var t = localStorage.getItem('papo-kafe-receitas:tema');
      if (t === 'claro' || t === 'escuro') {
        document.documentElement.dataset.theme = t === 'escuro' ? 'dark' : 'light';
        var c = t === 'escuro' ? '#17110c' : '#f7efe4';
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', c); m.removeAttribute('media'); });
      }
    } catch (e) {}
  </script>
